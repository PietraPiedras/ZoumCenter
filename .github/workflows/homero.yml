name: Diseñar publicación Homero
on:
  push:
    paths:
      - '.github/workflows/homero.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow
      - name: Componer fotografía original y tipografía
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from pathlib import Path
          W,H=1080,1350
          im=Image.new('RGB',(W,H),'#111814')
          d=ImageDraw.Draw(im)
          def font(n,bold=True):
              return ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans'+('-Bold' if bold else '')+'.ttf',n)
          def center(s,y,f,fill):
              d.text((540,y),s,font=f,fill=fill,anchor='mt')
          d.rounded_rectangle((40,34,1040,1315),radius=40,outline='#f9d844',width=4)
          center('ZOUM.CENTER  /  COLECCIÓN GEEK',65,font(29),'#f9d844')
          center("¡D’OH!",115,font(124),'#ffda39')
          center('¿QUIÉN APAGÓ LA LUZ?',254,font(51),'#fffaf0')
          src=ImageOps.exif_transpose(Image.open('20200614_041514.jpg')).convert('RGB')
          # crop only surrounding floor/reflection and empty background; preserve product proportions
          w,h=src.size
          src=src.crop((0,int(h*.13),w,int(h*.69)))
          src=ImageOps.contain(src,(775,775),Image.Resampling.LANCZOS)
          x=(1080-src.width)//2; y=338+(775-src.height)//2
          d.rounded_rectangle((x-7,y-7,x+src.width+7,y+src.height+7),radius=15,fill='#c8f455')
          im.paste(src,(x,y))
          # illustrated donut accent in the margin, never on product
          for cx,cy in [(126,530),(954,1000)]:
              d.ellipse((cx-46,cy-46,cx+46,cy+46),fill='#ca8847')
              d.ellipse((cx-40,cy-40,cx+40,cy+40),fill='#ef87b6')
              d.ellipse((cx-14,cy-14,cx+14,cy+14),fill='#111814')
              for dx,dy,col in [(-25,-12,'#fff3b3'),(18,-26,'#7af6dc'),(26,12,'#fff3b3'),(-15,28,'#ab77ed')]:
                  d.line((cx+dx,cy+dy,cx+dx+9,cy+dy+5),fill=col,width=5)
          center('VELADOR ARTESANAL DE MADERA',1150,font(35),'#ffda39')
          center('Iluminá tu lado fan.',1205,font(37,False),'#fffaf0')
          center('@zoum.center',1265,font(25),'#d0d9cc')
          p=Path('Instagram/Publicaciones/Homero.jpg')
          p.parent.mkdir(parents=True,exist_ok=True)
          im.save(p,quality=90,optimize=True)
          PY
      - name: Guardar diseño
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Instagram/Publicaciones/Homero.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Diseño Homero para feed con foto real'
            git pull --rebase
            git push
          fi
